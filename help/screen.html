<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 설정 · 운행 알림 도움말</title>
<style>
body{font-family:system-ui,sans-serif;max-width:640px;margin:0 auto;padding:16px 16px 32px;line-height:1.7;color:#212121;word-break:keep-all;overflow-wrap:anywhere;background:#F3F5F7}
h1{font-size:22px;margin:4px 0 8px}
h2{font-size:17px;margin:0 0 8px;color:#1B5E20}
.way{background:#E4F2E0;color:#1B5E20;font-weight:bold;font-size:14px;padding:8px 12px;margin:8px 0 12px}
.card{background:#fff;border:1px solid #E1E5EA;padding:12px 14px;margin:12px 0;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.card img{display:block;max-width:100%;width:330px;margin:4px auto 10px;border:1px solid #E1E5EA}
ul{margin:0;padding-left:20px}li{margin:5px 0}
.figtext p{margin:4px 0}
a.btn{display:block;background:#1B5E20;color:#fff;text-decoration:none;padding:12px;text-align:center;margin:10px 0}
a.row{display:block;background:#fff;border:1px solid #E1E5EA;color:#212121;text-decoration:none;padding:10px 14px;margin:8px 0}
a.row b{display:block;font-size:16px}a.row span{font-size:13px;color:#607D8B}
/* 2026-11-25 코스카님: 문단마다 사각 테두리(접힌 귀퉁이 없음) - 가독성 */
p:not(.sub):not(.lead),li{border:1px solid #CFD8DC;background:#fff;padding:10px 12px;margin:8px 0;border-radius:0}
ul{list-style:none;padding-left:0}
ol{padding-left:0;list-style-position:inside}
</style>
</head>
<body>
<h1>화면 설정</h1>
<div class="way">메뉴 → 설정 → 화면 설정</div>
<div class="card"><h2>화면 설정</h2><img src="img/help_screen_1.webp" alt="화면 설정"><div class="figtext"><p>① 글자와 칸 크기 : 글자가 작아 보이면 키웁니다.</p><p>② 잠금 화면에 시간표 : 오늘 시간표를 잠금 화면 배경으로 깝니다.</p><p>③ 밝은 바탕 · 어두운 바탕을 고릅니다.</p></div></div>
<div class="card"><h2>자세한 설명</h2><ul><li>글자와 칸 크기 : 화면이 넓은 기기에서 글자가 작아 보이면 키웁니다. 100이면 그대로입니다.</li><li>잠금 화면에 시간표 : 오늘 시간표를 잠금 화면 배경으로 깝니다. 바탕화면 배경은 건드리지 않습니다.</li><li>밝은 바탕·어두운 바탕을 고를 수 있습니다.</li></ul></div>
<a class="btn" href="index.html">다른 도움말 보기</a>
</body>
</html>
